# Netlify settings for the web app (project to deploy: apps/web).
# Netlify resolves `publish` from the repository root, not from apps/web.
# NEXT_PUBLIC_API_URL (the Render API URL) must be set in Site settings → Environment
# variables before the build: Next.js bakes it into the browser bundle.
[build]
  command = "pnpm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
