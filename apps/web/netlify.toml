# Netlify settings for the web app. In the Netlify UI set Base directory = apps/web.
# NEXT_PUBLIC_API_URL (the Render API URL) must be set in Site settings → Environment
# variables before the build: Next.js bakes it into the browser bundle.
[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
